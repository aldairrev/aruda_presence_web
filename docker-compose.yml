services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: aruda_presence_prod
    ports:
      - "80:8000"
    depends_on:
      - db
    env_file:
      - .env
    restart: always

  db:
    image: mysql:9.0
    container_name: aruda_presence_prod_db
    ports:
      - "3306:3306"
    environment:
      - MYSQL_ROOT_PASSWORD=secret
      - MYSQL_DATABASE=presence_db
      - MYSQL_USER=presence_user
      - MYSQL_PASSWORD=secret
    volumes:
      - db_data:/var/lib/mysql
    restart: always

volumes:
  db_data:
